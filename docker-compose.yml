version: '3.8'

services:
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: fly-meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=masterKey123
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=production
      - MEILI_HTTP_ADDR=0.0.0.0:7700
      - MEILI_MAX_INDEXING_THREADS=1
      - MEILI_HTTP_PAYLOAD_SIZE_LIMIT=10485760
    volumes:
      - meili_data:/meili_data
    restart: always

  backend:
    build: 
      context: ./fly_backend
      dockerfile: Dockerfile
    container_name: fly-backend
    ports:
      - "3001:3001"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=masterKey123
      - PORT=3001
    depends_on:
      - meilisearch
    restart: always

  frontend:
    build:
      context: ./fly_frontend
      dockerfile: Dockerfile
      args:
        # Replace with your EC2 Public IP or Domain
        - VITE_API_URL=http://localhost:3001
    container_name: fly-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  meili_data:
