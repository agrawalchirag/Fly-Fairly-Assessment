services:
  # 1. Meilisearch Engine
  meilisearch:
    image: getmeili/meilisearch:v1.12
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=masterKey
      - MEILI_NO_ANALYTICS=true
    volumes:
      - ./meili_data:/meili_data
    restart: always

  # 2. Backend (Express API)
  backend:
    build: ./fly_backend
    ports:
      - "3001:3001"
    environment:
      - MEILI_HOST=http://meilisearch:7700
      - MEILI_MASTER_KEY=masterKey
    depends_on:
      - meilisearch
    restart: always

  # 3. Frontend (React/Vite)
  frontend:
    build:
      context: ./fly_frontend
      args:
        - VITE_API_URL=http://localhost:3001
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always
