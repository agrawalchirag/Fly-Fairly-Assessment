services:
  # 1. Meilisearch (Private Service - internal only, enables DNS resolution)
  - type: pserv
    name: fly-meilisearch
    runtime: docker
    plan: free
    dockerfilePath: ./meili.Dockerfile
    envVars:
      - key: MEILI_MASTER_KEY
        generateValue: true
      - key: MEILI_NO_ANALYTICS
        value: "true"
      - key: MEILI_ENV
        value: "production"

  # 2. Backend (Express API)
  - type: web
    name: fly-backend
    runtime: node
    plan: free
    rootDir: fly_backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: MEILI_HOST
        value: http://fly-meilisearch:7700
      - key: MEILI_MASTER_KEY
        fromService:
          name: fly-meilisearch
          type: pserv
          envVarKey: MEILI_MASTER_KEY

  # 3. Frontend (React/Vite)
  - type: web
    name: fly-frontend
    runtime: static
    rootDir: fly_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: fly-backend
          type: web
          property: host
