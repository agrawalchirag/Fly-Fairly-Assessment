services:
  # 1. Meilisearch (Web Service)
  - type: web
    name: fly-meilisearch
    runtime: docker
    plan: free
    dockerfilePath: ./meili.Dockerfile
    envVars:
      - key: MEILI_MASTER_KEY
        generateValue: true
      - key: MEILI_NO_ANALYTICS
        value: "true"
      - key: MEILI_ENV
        value: "production"
      - key: PORT 
        value: "7700"
      - key: MEILI_MAX_INDEXING_THREADS # CRITICAL for 512MB RAM
        value: "1"
      - key: MEILI_HTTP_PAYLOAD_SIZE_LIMIT
        value: "10485760" # 10MB limit to prevent spikes

  # 2. Backend (Express API)
  - type: web
    name: fly-backend
    runtime: node
    plan: free
    rootDir: fly_backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: MEILI_HOST
        fromService:
          name: fly-meilisearch
          type: web
          property: host
      - key: MEILI_MASTER_KEY
        fromService:
          name: fly-meilisearch
          type: web
          envVarKey: MEILI_MASTER_KEY

  # 3. Frontend (React/Vite)
  - type: web
    name: fly-frontend
    runtime: static
    rootDir: fly_frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: fly-backend
          type: web
          property: host
